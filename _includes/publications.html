{% if site.data.data.publications %}
<section class="section publications-section">

  <h2 class="section-title"><i class="fa fa-file-text"></i>{{ site.data.data.publications.title }}</h2>

  {% for publication in site.data.data.publications.papers %}
    <div class="item">
      <div class="publication-title"><a href="{{ publication.link }}">{{ publication.title }}</a></div>
      <div class="publication-authors">{{ publication.authors }}</div>
      <div class="publication-conference">{{ publication.conference }}</div>
    </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}

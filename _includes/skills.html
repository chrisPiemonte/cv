{% if site.data.data.skills %}
<div class="skills-container container-block">

  <h2 class="container-block-title">{{ site.data.data.skills.title }}</h2>

  <ul class="list-unstyled skills-list">
    {% for group in site.data.data.skills.groups %}
    <li>
      <span class="skill-group">{{ group.name }}:</span>
      <span class="skill-items">{{ group.items }}</span>
    </li>
    {% endfor %}
  </ul>

</div><!--//skills-->
{% endif %}

studies: 
    - education:
      degree: MSc in Computer Science # Knowledge Engineering and Machine Intelligence
      university: University of Bari "Aldo Moro"
      time: 2016 - 2021
      details: |
        Developed an industrial thesis applying Deep Learning and Computer Vision to assess 
        car damage from images. Combined object detection and instance segmentation models to 
        identify vehicles, detect components, and assess damage severity. Integrated business 
        rules to estimate repair costs from model outputs.

    - education:
      degree: BSc in Computer Science # Technologies for software production
      university: University of Bari "Aldo Moro"
      time: 2011 - 2015
      details: |
        Explored semantic representation of web pages by combining graph-based random walk algorithms 
        with textual analysis of HTML content. Learned vector embeddings of pages and evaluated the 
        approach through unsupervised clustering with promising results.

experiences:

    - role: Specialist Machine Learning Engineer
      time: 2023 - Present
      company: Prometeia, Milan
      details: |
        Led the deployment of scalable cloud services powering AI applications, exposed via REST APIs. 
        Designed and built serverless, cloud-native architectures to support internal ML tools 
        and client-facing solutions.

    - role: Senior Machine Learning Engineer
      time: 2020 - 2023
      company: Prometeia, Milan
      details: |
        Designed distributed architectures for rule-based systems and high-volume ETL pipelines in
        anti-fraud and AML domains. Developed internal libraries and NLP-based automation services, 
        deployed across multiple environments as REST APIs.

          
    - role: Data Scientist
      time: 2019 - 2020
      company: Prometeia, Milan
      details: |
        Researched and trained deep learning models for object detection and instance segmentation 
        in insurance claim processing. Contributed to the system architecture enabling production 
        deployment and cost estimation based on image analysis.

    - role: Junior Data Scientist, Internship
      time: 2018 - 2019
      company: Prometeia, Milan
      details: |
        Built ETL pipelines and analytical tools on distributed systems using Scala, Python, and Spark. 
        Focused on data extraction, transformation, and analysis to support large-scale financial models 
        and internal analytics platforms.
